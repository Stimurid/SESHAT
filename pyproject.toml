[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "seshat-analytic-fabric"
version = "0.1.0a0"
description = "SESHAT universal analytic fabric contracts and runtime"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pypdf==6.21.1",
]

[project.scripts]
seshat-fabric-demo = "seshat.fabric_waves.demo:main"
seshat-fabric-operator = "seshat.fabric_waves.operator:main"
seshat-carpet-portfolio = "seshat.fabric_waves.carpet_portfolio:main"
seshat-m5-carpet = "seshat.fabric_waves.m5_room_carpet:main"
seshat-m6-research = "seshat.fabric_waves.m6_research_engine:main"
seshat-fabric-external = "seshat.fabric_waves.external_carrier.host_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/seshat"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires an actual offline Linux Docker daemon and synthetic image"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Explicit original core CI gate: syntax, runtime undefined names and unused imports.
# Ruff's rapidly growing optional style families are separately audited.
select = ["E4", "E7", "E9", "F"]
