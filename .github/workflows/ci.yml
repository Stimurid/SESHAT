name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ops-powershell:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: pwsh -File ops/codex_watch/tests/test-gate.ps1

  ops-publisher-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PowerShell 7 gate
        shell: pwsh
        run: ./ops/codex_watch/tests/test-gate.ps1
      - name: PowerShell 7 publisher and streaming recovery
        shell: pwsh
        run: ./ops/codex_watch/tests/test-publisher-recovery.ps1
      - name: Windows PowerShell 5.1 gate
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ops\codex_watch\tests\test-gate.ps1
      - name: Windows PowerShell 5.1 publisher and streaming recovery
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ops\codex_watch\tests\test-publisher-recovery.ps1
      - name: PowerShell 7 descendant containment
        shell: pwsh
        run: ./ops/codex_watch/tests/test-descendant-containment.ps1
      - name: Windows PowerShell 5.1 descendant containment
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ops\codex_watch\tests\test-descendant-containment.ps1
      - name: SysWOW64 Windows PowerShell 5.1 descendant containment struct sizes
        shell: cmd
        run: C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File ops\codex_watch\tests\test-descendant-containment.ps1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: python -m ruff check .
