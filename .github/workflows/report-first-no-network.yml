name: Report-first offline synthetic smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-report-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source identity
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Build synthetic-only image
        shell: bash
        run: docker build --pull=false -f Dockerfile.report -t seshat-report:pr .
      - name: Install host test dependencies (networked setup)
        shell: bash
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: OS-bounded PDF parser smoke on invented two-page source
        shell: bash
        run: |
          set -euo pipefail
          SESHAT_DOCKER_SMOKE_REQUIRED=1 SESHAT_SYNTHETIC_PDF_TEST_IMAGE=seshat-report:pr python -m pytest -q -p no:cacheprovider tests/test_pdf_sandbox.py -m docker
      - name: Bounded Docker network, rootfs and deadline drills
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges --memory 256m --memory-swap 256m --pids-limit 32 --cpus 1 seshat-report:pr python -c $'import errno, pathlib
          route_lines = pathlib.Path("/proc/net/route").read_text().strip().splitlines()
          assert len(route_lines) == 1, "unexpected container route"
          import socket
          try:
              with socket.create_connection(("1.1.1.1", 80), timeout=0.5):
                  raise AssertionError("network egress permitted")
          except OSError:
              pass
          try:
              pathlib.Path("/tmp/seshat-drill").write_text("x")
          except OSError as exc:
              assert exc.errno == errno.EROFS
          else:
              raise AssertionError("writable rootfs")'
          name="seshat-pdf-timeout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          timeout --signal=KILL 2s docker run --rm --name "$name" --network none --read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges --memory 64m --memory-swap 64m --pids-limit 32 --cpus 1 seshat-report:pr python -c 'import time; time.sleep(30)'
          status=$?
          set -e
          docker rm --force "$name" >/dev/null 2>&1 || true
          test "$status" -eq 124 -o "$status" -eq 137
          test -z "$(docker ps -a --filter "name=^/${name}$" --format '{{.Names}}')"
      - name: Offline unprivileged R01 text-generation and durable export
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          dest="$RUNNER_TEMP/seshat-synthetic-r01"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.report_demo --fixture meteorology --report R01 --scientific --output /out/report
          # A successful exit without an exported human-readable file is a FAIL.
          test -s "$dest/report/report.md"
          test -s "$dest/report/report.html"
          grep -q 'OWNER_AUTHORED_UNREVIEWED' "$dest/report/report.md"
          grep -q 'Осадки в горном водосборе' "$dest/report/report.md"
          grep -q 'Температура прибрежного слоя' "$dest/report/report.md"
      - name: Offline unprivileged private serial batch and safe preview
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-internal-batch"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.batch_demo --fixture meteorology --scientific --output /out/batch
          test -s "$dest/batch/batch_receipt.json"
          test -s "$dest/batch/manifest.json"
          test -s "$dest/batch/items/r01-readable/report.md"
          # NEVER expose/copy the private manifest, rights pins or SQLite ledger.
          cp "$dest/batch/items/r01-readable/report.md" "$RUNNER_TEMP/seshat-preview-r01.md"
          test -s "$RUNNER_TEMP/seshat-preview-r01.md"
          grep -q 'OWNER_AUTHORED_UNREVIEWED' "$RUNNER_TEMP/seshat-preview-r01.md"
      - name: Offline real G1 MethodBody to F07/F08/F09A synthetic bridge
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-g1-owner-private"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.fabric_waves.report_bridge_demo --output /out/one-method-run
          test -s "$dest/one-method-run/report/report.md"
          test -s "$dest/one-method-run/owner-private-batch/batch_receipt.json"
          test -s "$dest/one-method-run/owner-private-batch/items/r01-readable/report.md"
          grep -q 'FABRIC_GENERATED_UNREVIEWED' "$dest/one-method-run/report/report.md"
          grep -q 'VERIFIED_IN_SYNTHETIC_SOURCE' "$dest/one-method-run/report/report.md"
          # Only separately reviewed human-readable text can leave this private directory.
          grep -q 'FABRIC_GENERATED_UNREVIEWED' "$dest/one-method-run/owner-private-batch/items/r01-readable/report.md"
      - name: Offline report and batch security tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m seshat-report:pr python -m pytest -q -p no:cacheprovider tests/test_reports.py tests/test_batch.py tests/test_scientific_report.py tests/fabric_waves/test_report_bridge.py tests/fabric_waves/test_report_bridge_demo.py tests/test_pdf_page_evidence.py tests/test_pdf_sandbox.py tests/test_pdf_claims.py tests/test_source_access.py tests/test_m4_transport_boundary.py tests/fabric_waves/test_m5_room_carpet.py
      - name: M5 two-world carpet (bounded container)
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-m5-carpet"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --memory 512m --memory-swap 512m --pids-limit 64 --cpus 1 --tmpfs /tmp:rw,nosuid,nodev,size=256m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.fabric_waves.m5_room_carpet --output-dir /out/run
          test -s "$dest/run/m5_portfolio_receipt.json"
          test -s "$dest/run/synthetic-organisational-research/report.md"
          grep -q 'SYNTHETIC_ENGINEERING_ONLY' "$dest/run/synthetic-organisational-research/report.md"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m seshat-report:pr python -m ruff check --no-cache .
      - name: Print scope boundary
        shell: bash
        run: |
          echo 'TESTED=OFFLINE_SYNTHETIC_ONLY'
          echo 'SCIENTIFIC_ACCEPTANCE=NOT_PERFORMED'
          echo 'HUB_ISSUER=NOT_TESTED'
          echo 'CUSTOMER_RELEASE=NOT_AUTHORIZED'
      - name: Verify no residual PDF containers even after test failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -a --filter 'name=^/seshat-pdf-' --format '{{.Names}}' | tee "$RUNNER_TEMP/pdf-residual-containers.txt"
          test ! -s "$RUNNER_TEMP/pdf-residual-containers.txt"
