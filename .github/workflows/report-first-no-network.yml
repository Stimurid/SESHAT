name: Report-first offline synthetic smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-report-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact proposed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record source identity
        shell: bash
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Build synthetic-only image
        shell: bash
        run: docker build --pull=false -f Dockerfile.report -t seshat-report:pr .
      - name: Install host test dependencies (networked setup)
        shell: bash
        run: python -m pip install --no-cache-dir -e '.[dev]'
      - name: OS-bounded PDF parser smoke on invented two-page source
        shell: bash
        run: |
          set -euo pipefail
          SESHAT_DOCKER_SMOKE_REQUIRED=1 SESHAT_SYNTHETIC_PDF_TEST_IMAGE=seshat-report:pr python -m pytest -q -p no:cacheprovider tests/test_pdf_sandbox.py -m docker
      - name: Bounded Docker network, rootfs and deadline drills
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges --memory 256m --memory-swap 256m --pids-limit 32 --cpus 1 seshat-report:pr python -c $'import errno, pathlib
          route_lines = pathlib.Path("/proc/net/route").read_text().strip().splitlines()
          assert len(route_lines) == 1, "unexpected container route"
          import socket
          try:
              with socket.create_connection(("1.1.1.1", 80), timeout=0.5):
                  raise AssertionError("network egress permitted")
          except OSError:
              pass
          try:
              pathlib.Path("/tmp/seshat-drill").write_text("x")
          except OSError as exc:
              assert exc.errno == errno.EROFS
          else:
              raise AssertionError("writable rootfs")'
          name="seshat-pdf-timeout-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          timeout --signal=KILL 2s docker run --rm --name "$name" --network none --read-only --user 65532:65532 --cap-drop ALL --security-opt no-new-privileges --memory 64m --memory-swap 64m --pids-limit 32 --cpus 1 seshat-report:pr python -c 'import time; time.sleep(30)'
          status=$?
          set -e
          docker rm --force "$name" >/dev/null 2>&1 || true
          test "$status" -eq 124 -o "$status" -eq 137
          test -z "$(docker ps -a --filter "name=^/${name}$" --format '{{.Names}}')"
      - name: Offline unprivileged R01 text-generation and durable export
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          dest="$RUNNER_TEMP/seshat-synthetic-r01"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.report_demo --fixture meteorology --report R01 --scientific --output /out/report
          # A successful exit without an exported human-readable file is a FAIL.
          test -s "$dest/report/report.md"
          test -s "$dest/report/report.html"
          grep -q 'OWNER_AUTHORED_UNREVIEWED' "$dest/report/report.md"
          grep -q 'Осадки в горном водосборе' "$dest/report/report.md"
          grep -q 'Температура прибрежного слоя' "$dest/report/report.md"
      - name: Offline unprivileged private serial batch and safe preview
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-internal-batch"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.batch_demo --fixture meteorology --scientific --output /out/batch
          test -s "$dest/batch/batch_receipt.json"
          test -s "$dest/batch/manifest.json"
          test -s "$dest/batch/items/r01-readable/report.md"
          # NEVER expose/copy the private manifest, rights pins or SQLite ledger.
          cp "$dest/batch/items/r01-readable/report.md" "$RUNNER_TEMP/seshat-preview-r01.md"
          test -s "$RUNNER_TEMP/seshat-preview-r01.md"
          grep -q 'OWNER_AUTHORED_UNREVIEWED' "$RUNNER_TEMP/seshat-preview-r01.md"
      - name: Offline real G1 MethodBody to F07/F08/F09A synthetic bridge
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-g1-owner-private"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.fabric_waves.report_bridge_demo --output /out/one-method-run
          test -s "$dest/one-method-run/report/report.md"
          test -s "$dest/one-method-run/owner-private-batch/batch_receipt.json"
          test -s "$dest/one-method-run/owner-private-batch/items/r01-readable/report.md"
          grep -q 'FABRIC_GENERATED_UNREVIEWED' "$dest/one-method-run/report/report.md"
          grep -q 'VERIFIED_IN_SYNTHETIC_SOURCE' "$dest/one-method-run/report/report.md"
          # Only separately reviewed human-readable text can leave this private directory.
          grep -q 'FABRIC_GENERATED_UNREVIEWED' "$dest/one-method-run/owner-private-batch/items/r01-readable/report.md"
      - name: Offline report and batch security tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m seshat-report:pr python -m pytest -q -p no:cacheprovider tests/test_reports.py tests/test_batch.py tests/test_scientific_report.py tests/fabric_waves/test_report_bridge.py tests/fabric_waves/test_report_bridge_demo.py tests/test_pdf_page_evidence.py tests/test_pdf_sandbox.py tests/test_pdf_claims.py tests/test_pdf_claims_sandbox_bridge.py tests/test_source_access.py tests/test_m4_transport_boundary.py tests/fabric_waves/test_m5_room_carpet.py tests/fabric_waves/test_m5_room_builder.py tests/fabric_waves/test_m5_oracles.py tests/fabric_waves/test_m5_checkpoint.py
      - name: Full offline suite (every preserved test)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --memory 1g --memory-swap 1g --tmpfs /tmp:rw,nosuid,nodev,size=512m seshat-report:pr python -m pytest -q -p no:cacheprovider tests
      - name: M5 two-world carpet (bounded container)
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-m5-carpet"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --memory 512m --memory-swap 512m --pids-limit 64 --cpus 1 --tmpfs /tmp:rw,nosuid,nodev,size=256m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.fabric_waves.m5_room_carpet --output-dir /out/run
          world="$dest/run/synthetic-organisational-research"
          test -s "$dest/run/m5_portfolio_receipt.json"
          for name in room_manifest.json stones.json activations.jsonl sediment.json \
                      carpet.html report.md telemetry.json oracles.json receipt.json \
                      ledger.sqlite m5_checkpoint.json; do
            test -s "$world/$name"
          done
          grep -q 'SYNTHETIC_ENGINEERING_ONLY' "$world/report.md"
          # The operator answer must be an answer, not a counter dump.
          grep -q '## What remains unresolved' "$world/report.md"
          grep -q '## Next discriminating action' "$world/report.md"
          # The plan oracle must not appear anywhere in the compiled rooms.
          ! grep -q 'must_wave' "$world/room_manifest.json"
          # A real aporia was recorded by a real activation.
          grep -q 'BODY_APORIA' "$world/activations.jsonl"
          # No oracle may claim PASS without evidence, and NOT_TESTED is reported.
          python - "$world/oracles.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = data["rows"]
          assert len(rows) == 20, len(rows)
          for row in rows:
              assert row["observed"] in ("PASS", "FAIL", "NOT_TESTED"), row
              if row["observed"] == "PASS":
                  assert row["evidence"], row["oracle_id"]
          s = data["summary"]
          assert len(rows) == 20
          assert s["pass"] == 20
          assert s["fail"] == 0
          assert s["not_tested"] == 0
          print("RM_PASS=%d RM_FAIL=%d RM_NOT_TESTED=%d" % (s["pass"], s["fail"], s["not_tested"]))
          print("RM_NOT_TESTED_IDS=%s" % ",".join(s["not_tested_ids"]))
          PY
      - name: M6 two-world research engine with R05-R07 triad
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-m6-research"
          mkdir -p "$dest"
          chmod 700 "$dest"
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$dest,target=/out" seshat-report:pr python -m seshat.fabric_waves.m6_research_engine --output-dir /out/run
          test -s "$dest/run/m6_portfolio_receipt.json"
          test -s "$dest/run/world-u-synthetic-university/m6_report_bundle.json"
          test -s "$dest/run/world-u-synthetic-university/m6_external_ledger.json"
          test -s "$dest/run/world-u-synthetic-university/carpet.html"
          grep -q 'NONCOMPARABLE' "$dest/run/world-u-synthetic-university/m6_report.md"
          grep -q 'content_sha256' "$dest/run/world-u-synthetic-university/m6_report.md"
          python - "$dest/run/world-u-synthetic-university/m6_oracles.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          rows = data if isinstance(data, list) else data.get("rows", data)
          if isinstance(rows, dict):
              rows = rows.get("rows", [])
          fails = [r for r in rows if r.get("observed") == "FAIL"]
          assert not fails, fails
          ids = {r["oracle_id"] for r in rows}
          assert "RX09" in ids and "RX10" in ids
          print("M6_RX_PASS", len(rows))
          PY
          echo "M6_SYNTHETIC_PORTFOLIO=1"
      - name: M5 new-process resumed continuation from a checkpoint
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/seshat-m5-resume"
          mkdir -p "$dest"
          chmod 700 "$dest"
          # The portfolio run above already drove a child process; this step
          # drives the documented CLI path explicitly and keeps the evidence.
          cp -r "$RUNNER_TEMP/seshat-m5-carpet/run/synthetic-organisational-research/resume_probe" "$dest/" 2>/dev/null || true
          test -s "$dest/resume_probe/resume_evidence.json"
          python - "$dest/resume_probe/resume_evidence.json" <<'PY'
          import json, sys
          ev = json.load(open(sys.argv[1], encoding="utf-8"))
          assert ev["resumed_from_cursor"] >= 1, ev
          assert ev["continued_stone_ids"], ev
          assert ev["aporia_activations"], "the continued child must reach the aporia stone"
          print("RESUMED_FROM=%s CONTINUED=%s" % (ev["resumed_from_cursor"], ev["continued_stone_ids"]))
          PY
      - name: M5 negative cases - foreign fixture and unapproved digest are refused
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/seshat-m5-negative"
          mkdir -p "$out"
          printf '{"schema":"seshat.room_formation.x","thread_registry":[],"hosts":[]}' > "$out/invented.json"
          set +e
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m --mount "type=bind,source=$out,target=/in,readonly" seshat-report:pr python -m seshat.fabric_waves.m5_room_carpet --fixture /in/invented.json --output-dir /tmp/x
          status=$?
          set -e
          test "$status" -ne 0
          echo "UNAPPROVED_FIXTURE_REJECTED=1"
      - name: Installed wheel exposes the packaged fixture and CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --no-cache-dir build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
          python -m venv "$RUNNER_TEMP/wheelenv"
          "$RUNNER_TEMP/wheelenv/bin/pip" install --no-cache-dir "$RUNNER_TEMP"/dist/*.whl
          # Run from a directory that contains no checkout, so only the wheel
          # can supply the fixture resource.
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheelenv/bin/seshat-m5-carpet" --output-dir "$RUNNER_TEMP/wheel-run" --no-subprocess-resume
          test -s "$RUNNER_TEMP/wheel-run/m5_portfolio_receipt.json"
          echo "PACKAGED_FIXTURE_RESOLVED_FROM_WHEEL=1"
      - name: Lint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --user "$(id -u):$(id -g)" --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=128m seshat-report:pr python -m ruff check --no-cache .
      - name: Archive safe runtime artifacts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/m5-artifacts"
          mkdir -p "$stage"
          src="$RUNNER_TEMP/seshat-m5-carpet/run"
          if [ -d "$src" ]; then
            # Synthetic worlds only; no private corpus, no keys, no host paths.
            cp -r "$src" "$stage/m5_carpet" || true
          fi
          git rev-parse HEAD > "$stage/source_commit.txt"
          git rev-parse 'HEAD^{tree}' > "$stage/source_tree.txt"
          python - "$stage" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          lines = []
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  lines.append(f"{digest}  {path.relative_to(root)}")
          (root / "runtime_hashes.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"hashed {len(lines)} artifact files")
          PY
      - name: Upload M5 synthetic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-synthetic-artifacts
          path: ${{ runner.temp }}/m5-artifacts
          retention-days: 7
          if-no-files-found: warn
      - name: Print scope boundary
        shell: bash
        run: |
          echo 'TESTED=OFFLINE_SYNTHETIC_ONLY'
          echo 'SCIENTIFIC_ACCEPTANCE=NOT_PERFORMED'
          echo 'HUB_ISSUER=NOT_TESTED'
          echo 'CUSTOMER_RELEASE=NOT_AUTHORIZED'
      - name: Verify no residual PDF containers even after test failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker ps -a --filter 'name=^/seshat-pdf-' --format '{{.Names}}' | tee "$RUNNER_TEMP/pdf-residual-containers.txt"
          test ! -s "$RUNNER_TEMP/pdf-residual-containers.txt"
